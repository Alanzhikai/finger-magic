      camCtx.stroke();
    }
    camCtx.shadowBlur = 0;
    const TIPS = [4, 8, 12, 16, 20];
    for (let i = 0; i < lm.length; i++) {
      const tip = TIPS.indexOf(i) >= 0;
      camCtx.beginPath();
      camCtx.arc(lm[i].x * fw, lm[i].y * fh, tip ? fw / 105 : fw / 165, 0, Math.PI * 2);
      camCtx.fillStyle = tip ? '#ffb0c8' : '#eaffff';
      camCtx.fill();
    }
    // ★ 掌心轨迹球指示：手掌中心拖尾 + 中立位十字（回正点）+ 偏转方向箭头 + 中心高亮环
    //   镜像变换在调用方，坐标与骨架一致；箭头方向/长度来自姿态偏转 + 实时速度。
    const hx = (tipTrail.length ? tipTrail[tipTrail.length - 1].x : 0) * fw;
    const hy = (tipTrail.length ? tipTrail[tipTrail.length - 1].y : 0) * fh;
    if (neutralCX !== null) {
      // 中立位：手回到这个十字附近就停止旋转
      const nx = neutralCX * fw, ny = neutralCY * fh, r = fw / 80;
      camCtx.strokeStyle = 'rgba(150, 255, 210, .60)';
      camCtx.lineWidth = Math.max(1.2, fw / 360);
      camCtx.beginPath();
      camCtx.moveTo(nx - r, ny); camCtx.lineTo(nx + r, ny);
      camCtx.moveTo(nx, ny - r); camCtx.lineTo(nx, ny + r);
      camCtx.stroke();
      camCtx.beginPath(); camCtx.arc(nx, ny, fw / 105, 0, Math.PI * 2); camCtx.stroke();
    }
    if (tipTrail.length > 1) {
      camCtx.lineCap = 'round'; camCtx.lineJoin = 'round';
      camCtx.shadowColor = 'rgba(255, 150, 90, .9)'; camCtx.shadowBlur = Math.max(3, fw / 80);
      camCtx.lineWidth = Math.max(1.4, fw / 320);
      for (let i = 1; i < tipTrail.length; i++) {
        const a = i / tipTrail.length;
        camCtx.strokeStyle = 'rgba(255,' + Math.round(150 + 80 * a) + ',' +
                             Math.round(80 + 60 * a) + ',' + (0.12 + 0.72 * a).toFixed(3) + ')';
        camCtx.beginPath();
        camCtx.moveTo(tipTrail[i - 1].x * fw, tipTrail[i - 1].y * fh);
        camCtx.lineTo(tipTrail[i].x * fw, tipTrail[i].y * fh);
        camCtx.stroke();
      }
      camCtx.shadowBlur = 0;
      // 偏转方向箭头：从中立位指向当前手掌中心（长度随偏转/转速变化）
      const vx = tipVelArrow.x, vy = tipVelArrow.y, vm = Math.hypot(vx, vy);
      if (vm > 0.004) {
        const L = Math.min(fw * 0.26, vm * fw * 1.6);
        const ux = vx / vm, uy = vy / vm;
        const ex = hx + ux * L, ey = hy + uy * L;
        camCtx.strokeStyle = 'rgba(255, 236, 130, .95)';
        camCtx.fillStyle   = 'rgba(255, 236, 130, .95)';
        camCtx.lineWidth = Math.max(1.6, fw / 220);
        camCtx.beginPath(); camCtx.moveTo(hx, hy); camCtx.lineTo(ex, ey); camCtx.stroke();
        camCtx.beginPath();
        camCtx.moveTo(ex, ey);
        camCtx.lineTo(ex - ux * L * 0.30 - uy * L * 0.18, ey - uy * L * 0.30 + ux * L * 0.18);
        camCtx.lineTo(ex - ux * L * 0.30 + uy * L * 0.18, ey - uy * L * 0.30 - ux * L * 0.18);
        camCtx.closePath(); camCtx.fill();
      }
      camCtx.strokeStyle = 'rgba(255, 170, 90, .98)';
      camCtx.lineWidth = Math.max(1.8, fw / 160);
      camCtx.beginPath(); camCtx.arc(hx, hy, fw / 52, 0, Math.PI * 2); camCtx.stroke();
    }
  }
  const GEST_LABEL = {
    fist: '握拳 ✊', five: '五指张开 🖐', one: '数字 1 ☝️', two: '数字 2 ✌️',
    three: '数字 3 🤟', pinch: '轻捏 👌', none: '动作不清晰'
  };
  let lastHudRes = '', lastHudTip = '', lastHudConf = -1;
  function updateCamHud(info) {
    if (!camResEl) return;
    // 主循环每帧都会调用，只在值变化时写 DOM，避免无谓的重排/重绘
    let res = info ? (GEST_LABEL[info.g] || '识别中…') : '未检测到手';
    let tip = !info ? '把手放进画面'
            : info.g === 'none' ? '伸直/收起要分明'
            : (info.conf >= 0.6 ? '已锁定 · 保持' : '保持动作…');
    // ★ 照片球内「掌心轨迹球」：显示控制状态与实时转速（不需要摆任何特定手势）
    if (info && state === 'PHOTO' && info.g !== 'pinch' && info.g !== 'fist') {
      const v = (Math.round(tipSpeedNow * 10) / 10).toFixed(1);
      res = handRotActive ? '转球中 ✋' : '掌心待命 ✋';
      tip = handRotActive ? ('倾斜/转动 · 速度 ' + v) : '手掌倾斜或转动手腕…';
    }
    const conf = info ? Math.round((info.conf || 0) * 100) : 0;
    if (res !== lastHudRes)  { camResEl.textContent = res; lastHudRes = res; }
    if (tip !== lastHudTip)  { camTipEl.textContent = tip; lastHudTip = tip; }
    if (conf !== lastHudConf){ camConfEl.style.width = conf + '%'; lastHudConf = conf; }
  }

  let hands = null;                   // MediaPipe Hands 实例
  let latest = null;                  // 最新一帧（已时序平滑）的 21 个 landmark
  let handLostAt = 0;
  let lmVersion = 0;                  // 真实 MediaPipe 帧号（供稳定判定去重）
  // 关键点 EMA 平滑：跨帧指数加权平均，大幅降低 MediaPipe 抖动，
  // 既提升分类精度，也避免因单帧抖动丢手势（= 更灵敏）。
  let smoothLm = null;
  const SMOOTH_ALPHA = CONFIG.GEST.SMOOTH_ALPHA;   // 越大越跟手，越小越稳（见 CONFIG.GEST）
  function smoothLandmarks(raw) {
    if (!smoothLm || smoothLm.length !== raw.length) {
      smoothLm = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
      return smoothLm;
    }
    for (let i = 0; i < raw.length; i++) {
      smoothLm[i].x += (raw[i].x - smoothLm[i].x) * SMOOTH_ALPHA;
      smoothLm[i].y += (raw[i].y - smoothLm[i].y) * SMOOTH_ALPHA;
      smoothLm[i].z += (raw[i].z - smoothLm[i].z) * SMOOTH_ALPHA;
    }
    return smoothLm;
  }

  // 摄像头采集（不创建任何 <video> 元素，避免被宿主浮层化）
  let camStream = null, imgCap = null, hiddenVideo = null;
  let pumping = false, camCanvasVisible = true;   // 追踪小窗默认常驻显示

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.6);

  // ── 手势识别的跨帧状态与工具：三证据融合 + 迟滞 ──────────────────────────
  const FINGER_DEFS = [
    { mcp: 5,  pip: 6,  tip: 8  },   // 食指
    { mcp: 9,  pip: 10, tip: 12 },   // 中指
    { mcp: 13, pip: 14, tip: 16 },   // 无名指
    { mcp: 17, pip: 18, tip: 20 },   // 小指
  ];
  let fingerUp = [false, false, false, false];   // 迟滞状态：阈值带内保持上一帧
  const PALM_ROOTS = [5, 9, 13, 17];   // 掌根 4 点：拟合手掌横轴(PCA)与手掌中心
  const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
  const norm01  = (x, a, b) => clamp01((x - a) / (b - a));

  function analyze(lm) {
    const G = CONFIG.GEST;
    const palm = Math.max(1e-4, dist(lm[0], lm[9]));   // 掌长：所有指标的归一化基准
    // 手掌朝外的方向（腕 → 中指根），用它投影指尖位移：手掌倾斜/侧对镜头时
    // 仍能可靠量出"手指有没有朝外伸直"，不受投影缩短影响。
    const px = lm[9].x - lm[0].x, py = lm[9].y - lm[0].y, pz = lm[9].z - lm[0].z;
    const plen = Math.max(1e-4, Math.hypot(px, py, pz));
    const ux = px / plen, uy = py / plen, uz = pz / plen;

    // 每根手指的伸直得分 ∈ [0,1]：三个互补证据加权融合
    const straight = FINGER_DEFS.map(f => {
      const ratio = dist(lm[f.mcp], lm[f.tip]) /
                    Math.max(1e-4, dist(lm[f.mcp], lm[f.pip]) + dist(lm[f.pip], lm[f.tip]));
      const vx = lm[f.tip].x - lm[f.mcp].x,
            vy = lm[f.tip].y - lm[f.mcp].y,
            vz = lm[f.tip].z - lm[f.mcp].z;
      const along = (vx * ux + vy * uy + vz * uz) / palm;   // 沿掌方向的伸展
      const reach = dist(lm[0], lm[f.tip]) / palm;          // 指尖离腕远近
      const W = G.STRAIGHT_W;
      return W[0] * norm01(ratio, G.RATIO_RANGE[0], G.RATIO_RANGE[1]) +
             W[1] * norm01(along, G.ALONG_RANGE[0], G.ALONG_RANGE[1]) +
             W[2] * norm01(reach, G.REACH_RANGE[0], G.REACH_RANGE[1]);
    });

    // 迟滞：进入需 ≥ ON，退出需 ≤ OFF，中间保持上一帧状态 → 消除阈值附近横跳
    for (let i = 0; i < 4; i++) {
      if (!fingerUp[i] && straight[i] >= G.FINGER_ON) fingerUp[i] = true;
      else if (fingerUp[i] && straight[i] <= G.FINGER_OFF) fingerUp[i] = false;
    }
    const up = fingerUp.reduce((n, v) => n + (v ? 1 : 0), 0);
    // ★ 竖起食指判定：仅保留作"排除捏合误判"用（拇指食指可能靠得很近），
    //   不再作为旋转开关 —— 照片球改为整只手的「掌心轨迹球」驱动。
    const idxUp = (up === 1 && fingerUp[0]);
    const tipX = lm[8].x, tipY = lm[8].y;

    // 分类边际：每根手指离"翻转阈值"的最小距离。清晰动作里伸指远高于 OFF、
    // 收指远低于 ON → margin 大；半屈/松手过渡里得分全挤在迟滞带内 → margin 小。
    let margin = 1;
    for (let i = 0; i < 4; i++) {
      const d = fingerUp[i] ? straight[i] - G.FINGER_OFF : G.FINGER_ON - straight[i];
      if (d < margin) margin = d;
    }
    const conf = clamp01(margin / G.CONF_FULL);
    const spread = dist(lm[8], lm[20]) / palm;             // 手掌张开度

    // 👌 轻捏调取：只在发光照片球内识别。拇指食指靠近 + 四指平均伸直得分
    // 排除真握拳 + 排除五指全张；不要求三指笔直，微弯的 OK 也能放行。
    const pinchDist = dist(lm[4], lm[8]) / palm;
    const avgStraight = (straight[0] + straight[1] + straight[2] + straight[3]) * 0.25;
    // 竖起食指绝不判成捏合 → 不会误调取/误放大照片（不能误触）。
    const isPinch = state === 'PHOTO' && !idxUp &&
                    pinchDist < G.PINCH_DIST &&
                    avgStraight > G.PINCH_MIN_STRAIGHT &&
                    up <= G.PINCH_MAX_UP;

    let g = 'none';
    if (isPinch) g = 'pinch';                             // 👌 调取照片（仅 PHOTO）
    else if (margin < G.MIN_MARGIN) g = 'none';           // 动作不清晰：不累积、不触发
    else if (up === 0) g = 'fist';
    else if (up === 4) g = 'five';
    else if (up === 1) g = 'one';
    else if (up === 2) g = 'two';
    else g = 'three';

    // 掌根 4 点质心 → 稳健的手掌中心（不含腕点，减少手远近缩放/手指开合的漂移）
    const cx = (lm[5].x + lm[9].x + lm[13].x + lm[17].x) * 0.25;
    const cy = (lm[5].y + lm[9].y + lm[13].y + lm[17].y) * 0.25;
    // ★ 手掌朝向：4 个掌根点最小二乘拟合成一条直线（2D PCA 主方向）。
    //   比只用 lm17-lm5 两点更抗单点噪声（不会把短基线的噪声等权放大），
    //   手腕转动角度更平滑、更精确。主方向只有 180° 周期，再用有向横轴
    //   lm5→lm17 消歧，恢复完整 360° 有向性（无死角、翻转不跳变）。
    let sxx = 0, syy = 0, sxy = 0;
    for (const i of PALM_ROOTS) {
      const dx = lm[i].x - cx, dy = lm[i].y - cy;
      sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
    }
    let axis = 0.5 * Math.atan2(2 * sxy, sxx - syy);
    const vx = lm[17].x - lm[5].x, vy = lm[17].y - lm[5].y;
    if (vx * Math.cos(axis) + vy * Math.sin(axis) < 0) axis += Math.PI;
    const roll = axis + Math.PI;                       // 与旧 atan2(-vy17,-vx17) 同号
    return { g, roll, spread, count: up, straight, conf, margin, cx, cy, idxUp, tipX, tipY };
  }

  /* 手势稳定判定 + 握拳边沿触发（灵敏度见 CONFIG.GEST） */
  let lastG = null, stable = 0, appliedG = 'none', fistLatch = false, fistRelease = 0;
  let commitLockUntil = 0;             // 提交锁定到期时间（performance.now），期内忽略新手势
  let lastVer = -2;                    // 已计入稳定判定的 MediaPipe 帧号（去重）
  function pushGesture(info) {
    const g = info.g;
    // ★ 按真实 MediaPipe 帧计数：主循环 60fps、识别约 30fps，原来同一份 landmark
    //   被重复计数两次，稳定帧时长随帧率漂移、过渡态极易"凑够"就误提交。
    if (info.ver !== undefined && info.ver === lastVer && g !== 'none') return;
    if (info.ver !== undefined) lastVer = info.ver;
    // 照片球内：捏合用更短稳定帧（更易触发）；握拳退出反而要更久确认，
    // 防止捏合/松手过渡里被误读成握拳，意外退出跳回待机。
    const NEED = (state === 'PHOTO' && g === 'pinch') ? CONFIG.GEST.PINCH_STABLE
               : (state === 'PHOTO' && g === 'fist')  ? CONFIG.GEST.FIST_EXIT_STABLE
               : CONFIG.GEST.STABLE_FRAMES;
    const now = performance.now();
    if (g === lastG) stable++; else { stable = 1; lastG = g; }   // 首帧即计 1：NEED 帧名副其实

    // 握拳锁存的复位也要"钝"一点：需连续若干帧非握拳才解锁，
    // 避免握拳过程中夹杂一两帧过渡/抖动就把 resetAll 重复触发一遍。
    if (g === 'fist') fistRelease = 0;
    else if (++fistRelease > 3) fistLatch = false;

    // 动作不清晰（半屈/过渡）或手离开：不累积、不触发
    if (g === 'none') { handLostAt = now; return; }
    if (stable < NEED) return;         // ★ 清晰动作必须连续保持 NEED 帧才提交
    // ★ 置信度门控：动作不够清晰就不提交（半屈/过渡态一律不触发，防误触）。
    //   pinch 是拇指食指相触、其余指自然微弯的姿态，评分偏低，单独豁免。
    if (g !== 'pinch' && (info.conf ?? 1) < CONFIG.GEST.SWITCH_CONF) return;

    if (g === 'fist') {
      if (!fistLatch) {
        fistLatch = true;
        appliedG = 'none';             // 重置后允许再次触发同一手势
        commitLockUntil = now + CONFIG.GEST.COMMIT_LOCK * 1000;  // 提交后短暂锁定，防来回跳
        onGesture('fist');
      }
      return;
    }
    // 非握拳手势：只有"与当前已提交手势不同"且"已过提交锁定期"才切换，
    // 这样触发后稳定不动，除非明确做出下一个不同动作（杜绝噪声来回跳变）。
    if (g !== appliedG && now >= commitLockUntil) {
      appliedG = g;
      commitLockUntil = now + CONFIG.GEST.COMMIT_LOCK * 1000;
      onGesture(g);
    }
  }

  /* ==================================================================
   * 旋转驱动
   *   - 图案(数字/I❤U/💗)：沿用单轴 Y 增量 + 限幅，跟手但防误跳（历史行为不变）。
   *   - 照片球：掌心轨迹球，不依赖任何特定手指姿势，直接用整只手的姿态：
   *       手掌中心相对自适应中立位的偏转 → 持续角速度（上下 → 绕 X，左右 → 绕 Y），
   *       手腕转动 roll 的偏转 → 绕 Z 环盘自转；偏转越大转得越快，保持倾斜可
   *       无限累积过 360°（世界系四元数积分覆盖完整 SO(3)，正背面无死角）。
   *       手腕转动角速度 + 手掌移动速度额外叠加"甩动加速" → 手快球快。
   *       ★ 手回正/停住 → 死区后不驱动，走惯性阻尼余韵，照片比粒子慢一点点停。
   *       ★ 少误触：👌 调取 / 握拳退出 / 手指全收起时屏蔽旋转；按真实 MediaPipe
   *         帧号(ver)去重、真实帧间隔 dt 计速、姿态与速度双 EMA、双死区滤抖。
   *   - 追踪窗高亮手掌中心 + 中立位十字 + 偏转方向箭头 + 拖尾轨迹。
   * ================================================================== */
  let shapeTargetRotY = 0, baseRoll = null, handWasPresent = false;   // 图案单轴旋转
  let prevRoll = null;                                                  // 图案阶段手掌 roll 基准
  let sRollX = null, sRollY = null;                                     // roll 的 sin/cos EMA（处理 ±π 回绕）
  // ★ 掌心轨迹球：只在真实识别帧上计速，姿态与速度都做平滑
  let tipSX = null, tipSY = null;      // 手掌中心 EMA（平滑后的姿态追踪点）
  let tipVX = 0, tipVY = 0;            // 手掌中心移动速度 EMA（归一化坐标 / 秒）
  let lastTipX = 0, lastTipY = 0;      // 上一真实帧的平滑手掌中心（用于差分）
  let lastRotVer = -1;                 // 已计速的真实帧号 → 去重
  let lastRotTime = 0;                 // 上一真实帧时间(ms) → 真实帧间隔
  let handRotActive = false;           // 有偏转 / 有速度 → 有驱动角速度
  let tipSpeedNow = 0;                 // 当前合成转速幅值（HUD / 方向箭头）
  const tipTrail = [];                 // 追踪窗手掌中心拖尾（TRAIL_LEN 点）
  const tipVelArrow = { x: 0, y: 0 };  // 追踪窗偏转方向箭头
  // 手掌朝向 EMA 与自适应中立位（roll 用 sin/cos 平均，天然处理 ±π 回绕）
  let rollSX = null, rollSY = null;
  let lastPoseRoll = 0, rollVel = 0;   // 上一帧 roll / 手腕转动角速度 EMA (rad/s)
  let neutralCX = null, neutralCY = null;   // 手掌中心中立位
  let neutralRX = null, neutralRY = null;   // roll 中立位（sin/cos 单位向量）

  // 照片球全向旋转状态
  const AUTO_SPIN = new THREE.Vector3(0, CONFIG.SPHERE_SPIN, 0);       // 恒定缓慢自转
  const partQ = new THREE.Quaternion();       // 发光粒子球朝向
  const photoQ = new THREE.Quaternion();      // 照片球朝向（略滞后于粒子球）
  const partHandW = new THREE.Vector3();      // 粒子球"手势角速度"（带惯性衰减）
  const photoHandW = new THREE.Vector3();     // 照片球"手势角速度"（阻尼略小 → 晚一点停）
  const driveW = new THREE.Vector3();         // 指尖速度 → 目标角速度（手快球快，硬上限 MAX_W）
  const flingW = new THREE.Vector3();         // 键盘方向键(演示)的角速度冲量（独立衰减）
  const _wP = new THREE.Vector3(), _wQ = new THREE.Vector3();
  const _dq = new THREE.Quaternion(), _axis = new THREE.Vector3();

  // 世界系角速度 w 积分到四元数：q ← axisAngle(w/|w|, |w|·dt) · q
  function integrateQuat(q, w, dt) {
    const len = w.length();
    if (len < 1e-6) return;
    _axis.copy(w).multiplyScalar(1 / len);
    _dq.setFromAxisAngle(_axis, len * dt);
    q.premultiply(_dq).normalize();
  }

  // 键盘方向键(演示) → 会衰减的角速度冲量（两球共用）
  function injectHandMotion(dx, dy, dRoll) {
    const P = CONFIG.PHYS;
    flingW.add(_axis.set(dy, dx, dRoll).multiplyScalar(P.FLING_GAIN * CONFIG.ROT_DIR));
    flingW.clampLength(0, P.MAX_W);
  }

  /* 清空掌心姿态轨迹状态：手离开 / 不在照片球 / 屏蔽手势时调用，
     避免重新出现时因坐标或角度跳变产生假速度尖峰。 */
  function resetTipTrack() {
    tipSX = tipSY = null;
    tipVX = tipVY = 0; tipSpeedNow = 0;
    lastTipX = lastTipY = 0;
    lastRotVer = -1; lastRotTime = 0;
    tipTrail.length = 0;
    tipVelArrow.x = tipVelArrow.y = 0;
    rollSX = rollSY = null;
    lastPoseRoll = 0; rollVel = 0;
    neutralCX = neutralCY = null;
    neutralRX = neutralRY = null;
    driveW.set(0, 0, 0);
    handRotActive = false;
  }

  function updateRotation(info, present) {
    if (!present) {
      baseRoll = null; handWasPresent = false; prevRoll = null;
      sRollX = sRollY = null;
      resetTipTrack();          // 手离开：清指尖轨迹，回手重新标定
      return;
    }

    const inPhoto = (state === 'PHOTO' || photoGroup.visible);

    // ── 图案阶段（数字 / I❤U / 💗）：手掌 roll 单轴跟手旋转，历史行为不变 ──
    if (!inPhoto) {
      handRotActive = false; driveW.set(0, 0, 0);
      tipTrail.length = 0; tipSX = tipSY = null; tipVX = tipVY = 0; tipSpeedNow = 0;
      const A = CONFIG.PHYS.ROT_SMOOTH;
      if (sRollX === null) { sRollX = Math.cos(info.roll); sRollY = Math.sin(info.roll); }
      else {
        sRollX += (Math.cos(info.roll) - sRollX) * A;
        sRollY += (Math.sin(info.roll) - sRollY) * A;
      }
      const roll = Math.atan2(sRollY, sRollX);
      // 首帧只建立基准，不注入，避免入场瞬间突变
      if (baseRoll === null || !handWasPresent) {
        baseRoll = roll; handWasPresent = true; prevRoll = roll;
        return;
      }
      let dRoll = roll - prevRoll;
      dRoll = Math.atan2(Math.sin(dRoll), Math.cos(dRoll));   // 角度回绕安全
      prevRoll = roll; baseRoll = roll;
      const d = Math.max(-0.14, Math.min(0.14, dRoll));       // 限幅防误跳
      shapeTargetRotY += CONFIG.ROT_DIR * d * CONFIG.SHAPE_ROT_GAIN;
      return;
    }

    // ── 照片球：掌心轨迹球，不需要摆任何特定手指姿势 ──
    //   👌 调取 / 握拳退出 / 手指全收起时屏蔽旋转：功能手势不会顺带把球带转。
    const blocked = (info.g === 'pinch' || info.g === 'fist' || (info.count ?? 1) === 0);
    if (blocked) { resetTipTrack(); return; }

    const P = CONFIG.PHYS;
    const now = performance.now();
    // 真实 MediaPipe 帧去重：同一个 ver 只在第一帧计速，60fps 主循环不重复放大速度
    if (info.ver === lastRotVer) return;

    // 手掌中心 + 手掌朝向 EMA（roll 用 sin/cos 平均，天然处理 ±π 回绕）
    const A = P.POSE_SMOOTH;
    if (tipSX === null) { tipSX = info.cx; tipSY = info.cy; }
    else {
      tipSX += (info.cx - tipSX) * A;
      tipSY += (info.cy - tipSY) * A;
    }
    if (rollSX === null) { rollSX = Math.cos(info.roll); rollSY = Math.sin(info.roll); }
    else {
      rollSX += (Math.cos(info.roll) - rollSX) * A;
      rollSY += (Math.sin(info.roll) - rollSY) * A;
    }
    const poseRoll = Math.atan2(rollSY, rollSX);

    // 拖尾（与骨架同一镜像坐标系）：画的是手掌中心，不是某根手指
    tipTrail.push({ x: tipSX, y: tipSY });
    if (tipTrail.length > P.TRAIL_LEN) tipTrail.shift();

    // 首帧 / 手重新出现：只立中立基准，不注入
    if (lastRotTime === 0) {
      neutralCX = tipSX; neutralCY = tipSY;
      neutralRX = rollSX; neutralRY = rollSY;
      lastTipX = tipSX; lastTipY = tipSY; lastPoseRoll = poseRoll;
      lastRotTime = now; lastRotVer = info.ver;
      driveW.set(0, 0, 0); handRotActive = false; tipSpeedNow = 0;
      tipVelArrow.x = tipVelArrow.y = 0;
      return;
    }
    const dt = Math.max(P.DT_MIN, Math.min(P.DT_MAX, (now - lastRotTime) / 1000));
    lastRotTime = now; lastRotVer = info.ver;

    // 手腕转动角速度 + 手掌中心移动速度 → EMA 平滑（"跟转动方向和速度"）
    let dRollFrame = poseRoll - lastPoseRoll;
    dRollFrame = Math.atan2(Math.sin(dRollFrame), Math.cos(dRollFrame));
    lastPoseRoll = poseRoll;
    tipVX += ((tipSX - lastTipX) / dt - tipVX) * P.VEL_SMOOTH;
    tipVY += ((tipSY - lastTipY) / dt - tipVY) * P.VEL_SMOOTH;
    lastTipX = tipSX; lastTipY = tipSY;
    rollVel += (dRollFrame / dt - rollVel) * P.VEL_SMOOTH;
    const moveSpeed = Math.hypot(tipVX, tipVY);

    // 相对自适应中立位的偏转（限幅防手出画时无限快）
    const cl = (v, m) => Math.max(-m, Math.min(m, v));
    const dx = cl(tipSX - neutralCX, P.TILT_MAX);
    const dy = cl(tipSY - neutralCY, P.TILT_MAX);
    let dRoll = poseRoll - Math.atan2(neutralRY, neutralRX);
    dRoll = Math.atan2(Math.sin(dRoll), Math.cos(dRoll));   // 角度回绕安全
    dRoll = cl(dRoll, P.ROLL_MAX);
    const tiltMag = Math.hypot(dx, dy, dRoll * P.ROLL_WEIGHT);

    // 中立位自适应：静止且回正时缓慢校准到当前姿态 → 任意自然姿势起手都不会误转；
    // 主动偏转 / 有速度时基准保持不动 → 保持倾斜即可持续转到任意朝向。
    if (tiltMag < P.DEAD_TILT && moveSpeed < P.DEAD_VEL && Math.abs(rollVel) < P.DEAD_VEL) {
      const B = P.NEUTRAL_ALPHA;
      neutralCX += (tipSX - neutralCX) * B;
      neutralCY += (tipSY - neutralCY) * B;
      neutralRX += (rollSX - neutralRX) * B;
      neutralRY += (rollSY - neutralRY) * B;
      const nl = Math.hypot(neutralRX, neutralRY) || 1;
      neutralRX /= nl; neutralRY /= nl;
    }

    // 方向映射（MediaPipe 归一化坐标 y 向下为正）：
    //   手往下偏 dy>0 → ωx>0（下旋转）；往右偏 dx>0 → ωy>0（右旋转）；
    //   手腕转动 dRoll → ωz 环盘自转。速度项叠加"甩一下"的加速。
    //   ★ 回正门控：偏转接近中立位时把速度项一并收掉，保证手回正就干净停稳；
    //     有明显偏转（想转球）时速度项完整生效 → 手快球快、不误触。
    const tiltGate = Math.min(1, tiltMag / (P.DEAD_TILT * 3));
    const wx = dy * P.TILT_GAIN + tipVY * P.SPEED_GAIN * tiltGate;
    const wy = dx * P.TILT_GAIN + tipVX * P.SPEED_GAIN * tiltGate;
    const wz = dRoll * P.ROLL_GAIN + rollVel * P.ROLL_SPEED_GAIN * tiltGate;

    const active = tiltMag >= P.DEAD_TILT;
    if (!active) {
      driveW.set(0, 0, 0);
      tipVX = tipVY = 0; rollVel *= 0.6;
      handRotActive = false; tipSpeedNow = 0;
      tipVelArrow.x = tipVelArrow.y = 0;
    } else {
      driveW.set(wx, wy, wz)
            .multiplyScalar(CONFIG.ROT_DIR).clampLength(0, P.MAX_W);
      handRotActive = true;
      tipSpeedNow = driveW.length();
      tipVelArrow.x = dx + tipVX * 0.12;
      tipVelArrow.y = dy + tipVY * 0.12;
    }
  }


  /* ==================================================================
   * 8. 主循环
   * ================================================================== */
  const clock = new THREE.Clock();

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    stateTime += dt;

    // 手势检测由摄像头帧泵 startPump() 驱动（见 beginCamera 之后），此处不发送

    // 手势 → 状态（latest 为 null 时也要推送 'none'，保证握拳边沿锁存能复位）
    const info = latest ? analyze(latest) : { g: 'none', spread: 0, conf: 0, margin: 0 };
    info.ver = latest ? lmVersion : -1;       // 真实帧号：供 pushGesture 去重计数
    pushGesture(info);
    updateCamHud(latest ? info : null);       // 摄像头追踪小窗：实时识别结果 + 置信度
    if (latest) {
      updateRotation(info, true);
      // 旋转只由「整只手的姿态偏转 + 转动/移动速度」驱动；调取放大仅由 onGesture('pinch') 边沿触发
    } else {
      updateRotation(info, false);
    }

    // 💗 炸出后的去向：
    //   键盘 H 直达（autoSplit=true）→ 0.95s 后自动分裂成照片球；
    //   手势"再握拳"进入（autoSplit=false）→ 由 onGesture('fist') 立即展开；
    //   安全兜底：💗 出现后若长时间保持张开手（未握拳），6s 后也自动展开，避免卡死。
    if (state === 'HEART') {
      if (autoSplit && stateTime > 0.95) {
        autoSplit = false; burstIntoPhotos(); setState('PHOTO');
      } else if (!autoSplit && stateTime > 6 && latest && analyze(latest).g !== 'fist') {
        burstIntoPhotos(); setState('PHOTO');
      }
    }

    // 发光照片球：全向 360° 旋转 + 惯性阻尼 + 离心力膨胀
    if (state === 'PHOTO' && photoGroup.visible && photos.length) {
      const P = CONFIG.PHYS;
      // 真实识别帧断流（手停住 / 摄像头掉帧 / 手出画）超过阈值 → 视为手停，
      // 走阻尼衰减，避免旧帧的角速度一直驱动、球永远停不下来。
      if (handRotActive && performance.now() - lastRotTime > P.STALE_MS) handRotActive = false;
      // 甩动冲量独立衰减（无论手在不在都生效，保证键盘/甩动惯性）
      flingW.multiplyScalar(Math.exp(-P.FLING_DAMP * dt));
      if (handRotActive) {
        // 掌心轨迹球：角速度平滑逼近"姿态偏转对应的目标角速度" → 跟随延迟即惯性感。
        // 保持倾斜就持续转，可累积过 360° 到任意朝向，不再只在局部来回转。
        const k = 1 - Math.exp(-P.DRIVE_RESP * dt);
        partHandW.lerp(driveW, k);
        photoHandW.lerp(driveW, k * P.PHOTO_RESP);   // 照片球响应略慢 → 慢一点点
      } else {
        // 手指停/离开：角速度按 e^(-阻尼·t) 衰减 → 继续"往前"转一点再停（惯性余韵）
        partHandW.multiplyScalar(Math.exp(-P.DAMP_PART * dt));
        photoHandW.multiplyScalar(Math.exp(-P.DAMP_PHOTO * dt));
      }
      _wP.copy(AUTO_SPIN).add(partHandW).add(flingW);   // 实际角速度 = 自转 + 手势 + 甩动
      _wQ.copy(AUTO_SPIN).add(photoHandW).add(flingW);
      integrateQuat(partQ, _wP, dt);
      integrateQuat(photoQ, _wQ, dt);
      // clamp：照片朝向相对粒子朝向的角差不超过阈值，防止"慢太多"脱节
      const lag = partQ.angleTo(photoQ);
      if (lag > P.PHOTO_LAG_MAX) photoQ.slerp(partQ, (lag - P.PHOTO_LAG_MAX) / lag);
      // 停稳后缓慢回齐：减速期仍保留"照片慢一点点停"的滞后，几乎静止时才把
      // 朝向与角速度一起收敛到粒子球，消除长期固定角差（持续旋转后也能干净对齐）。
      if (!handRotActive) {
        const wNow = partHandW.length() + photoHandW.length() + flingW.length();
        const g = Math.max(0, 1 - wNow / 1.6);      // 旋转/减速初期≈0(保留滞后)，静止≈1
        // 先收拢角速度差（它是固定错位的根源），再清掉已积累的朝向角差
        photoHandW.lerp(partHandW, 1 - Math.exp(-3.2 * dt * g));
        const k = (1 - Math.exp(-3.2 * dt)) * g;
        if (k > 0) photoQ.slerp(partQ, k);
      }
      photoGroup.quaternion.copy(photoQ);
      field.points.quaternion.copy(partQ);     // 发光粒子球与照片球同步（各自全向）

      // 离心力：F_c = m·ω²·r, a_c = ω²·r。膨胀 ∝ ω²·SPHERE_R(球半径) → 跟球半径有关；
      //   CENTRI_MAX 限幅不过大；平滑跟随让建立/消退有过程。每个粒子的个体系数
      //   在 ParticleField.update 里作用，使"粒子间距增大幅度各不相同"。
      const w = partHandW.length() + flingW.length();
      const targetExpand = Math.min(P.CENTRI_K * w * w * CONFIG.SPHERE_R, P.CENTRI_MAX);
      field.expand += (targetExpand - field.expand) * Math.min(1, dt * P.CENTRI_SPEED);

      const front = frontPhotoIndex();
      photos.forEach((p, i) => {
        if (i === zoomIdx) { p.material.color.setScalar(1); return; }
        const b = (i === front && zoomIdx < 0) ? 1.0 : 0.78;   // 正对屏幕的那张更亮
        p.material.color.setScalar(b);
        if (p.userData.fading) p.material.opacity += (1 - p.material.opacity) * Math.min(1, dt * 4.5);
      });
    }

    // 图案(数字/告白/爱心)：跟随手掌旋转，平滑插值（旋转手即可让立体字形自由转）
    if (state === 'NUMBER' || state === 'LOVE' || state === 'HEART') {
      let cur = field.points.rotation.y, d = shapeTargetRotY - cur;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      field.points.rotation.y = cur + d * Math.min(1, dt * 6);
    }

    // ★ 粒子球在照片模式下常亮不淡出（参考视频里发光光球始终环绕照片），
    //   只在离开照片球（hidePhotos → resetAll/showDust）时才恢复实心 3D 材质。

    updateTweens(dt);

    // 全向 billboard：照片局部四元数取照片球四元数的逆 → 世界朝向恒为单位(正对相机)。
    // 球转到任意 3D 角度，每一张照片都清晰可辨，不露白框背面（放在补间之后避免被覆盖）。
    if (state === 'PHOTO' && photoGroup.visible) {
      invPhotoQ.copy(photoGroup.quaternion).invert();
      photos.forEach((p, i) => {
        if (i !== zoomIdx && p.parent === photoGroup) p.quaternion.copy(invPhotoQ);
      });
    }

    field.update(dt, t);
    updateFloaters(dt, t);
    updateFireworks(dt, t);
    if (state === 'IDLE') field.points.rotation.y += dt * 0.04;

    renderer.render(scene, camera);
  }

  /* ==================================================================
   * 9. 启动：点击授权摄像头 / 键盘演示兜底
   *    说明：浏览器（尤其 CodePen 的 iframe）要求 getUserMedia 必须
   *    在"用户手势"内调用，页面加载自动调用会被直接拒绝，因此改为
   *    点击按钮触发；无摄像头环境（file://、被拒、无设备）可走键盘演示。
   * ================================================================== */
  const startEl = document.getElementById('start');
  const camStartBtn = document.getElementById('camStart');
  const demoStartBtn = document.getElementById('demoStart');
  const startTip = document.getElementById('startTip');
  let cameraReady = false, demoMode = false;

  // 待机星尘 + 渲染循环（先跑起来，遮罩覆盖在上层）
  showDust();
  initHandDemo(); guideReady = true; updateGuide();   // 初始化左上角动态动作指引
  tick();

  const hideStart = () => startEl.classList.add('hide');

  async function initMediaPipe() {
    try {
      await loadScript(CONFIG.MP_URL + 'hands.js');
      const h = new window.Hands({ locateFile: (f) => CONFIG.MP_URL + f });
      h.setOptions({
        maxNumHands: 1, modelComplexity: 1,
        minDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
        selfieMode: true
      });
      h.onResults((res) => {
        const raw = (res.multiHandLandmarks && res.multiHandLandmarks[0]) || null;
        if (raw) { latest = smoothLandmarks(raw); lmVersion++; handLostAt = performance.now(); }
        else { latest = null; smoothLm = null; updateCamHud(null); }   // 手离开：清空平滑，避免回手时串味
      });
      // ★ Hands 实例创建 ≠ 模型就绪：未 initialize 就 send，第一帧的 Promise
      //   可能永不 resolve；帧泵一旦 await 就会永久卡死（画面冻结、手势追踪失效）。
      //   等 wasm 真正加载完再把实例交给帧泵。
      if (typeof h.initialize === 'function') await h.initialize();
      hands = h;
    } catch (e) {
      // 摄像头已可用但手势模型加载失败：退回键盘演示，避免用户卡在纯黑待机
      demoMode = true;
      setHint('手势模型加载失败，已切换为键盘演示：1/2/3 数字 · 4 告白 → F 握拳进发光照片球 · H 直达 · 空格/P 调取放大照片 · ←→↑↓ 旋转 · R 重置', 8000);
    }
  }

  async function beginCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      startTip.textContent = '当前环境不支持摄像头（需 HTTPS 或 localhost，或改用键盘演示）';
      return false;
    }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }, audio: false
      });
      const track = camStream.getVideoTracks()[0];
      // 优先 ImageCapture：直接从轨道抓帧，页面里零 <video> 元素，
      // 不会被 WorkBuddy/浏览器当作视频播放器套全屏浮层盖住粒子。
      if (typeof ImageCapture !== 'undefined') {
        try { imgCap = new ImageCapture(track); } catch (e) { imgCap = null; }
      }
      if (!imgCap) {
        // 兜底：内存 video（不插入 DOM，同样避开浮层）
        hiddenVideo = document.createElement('video');
        hiddenVideo.muted = true; hiddenVideo.playsInline = true;
        hiddenVideo.srcObject = camStream;
        await hiddenVideo.play().catch(() => {});
      }
      startPump();
      return true;
    } catch (e) {
      const n = e && e.name;
      let msg = '摄像头启动失败：' + (n || e.message || e);
      if (n === 'NotAllowedError' || n === 'SecurityError')
        msg = '摄像头权限被拒绝 —— 请点击地址栏的摄像头图标允许后重试，或改用键盘演示';
      else if (n === 'NotFoundError' || n === 'OverconstrainedError')
        msg = '未检测到摄像头设备';
      else if (n === 'NotReadableError')
        msg = '摄像头被其他程序占用，请关闭后重试';
      else if (n === 'AbortError')
        msg = '摄像头初始化被中断，请重试';
      startTip.textContent = msg;
      return false;
    }
  }

  // 帧泵：持续把摄像头帧喂给 MediaPipe，并回显到左下角追踪小窗（画面 + 骨架）
  function startPump() {
    if (pumping) return;
    pumping = true;
    let sendBusy = false;
    const loop = async () => {
      if (!pumping) return;
      try {
        let frame = null;
        if (imgCap) { try { frame = await imgCap.grabFrame(); } catch (e) { frame = null; } }
        else if (hiddenVideo && hiddenVideo.readyState >= 2) frame = hiddenVideo;
        if (frame) {
          if (camCanvasVisible) {
            const fw = frame.width || frame.videoWidth || 320;
            const fh = frame.height || frame.videoHeight || 240;
            if (camCanvas.width !== fw) camCanvas.width = fw;
            if (camCanvas.height !== fh) camCanvas.height = fh;
            camCtx.clearRect(0, 0, fw, fh);
            // 自拍镜像（与 MediaPipe selfieMode 的 landmark 坐标系一致），
            // 骨架在同一变换内绘制才能与画面对齐；文字用 HTML 覆盖层，不会翻转。
            camCtx.save();
            camCtx.translate(fw, 0); camCtx.scale(-1, 1);
            camCtx.drawImage(frame, 0, 0, fw, fh);
            if (latest) drawSkeleton(latest, fw, fh);
            camCtx.restore();
          }
          // ★ 抓帧/回显不依赖模型状态：模型加载中（或加载失败）画面也持续刷新。
          //   send 绝不 await：MediaPipe 老版本 send() 的 Promise 可能永不 resolve
          //   （wasm 未就绪/内部异常），await 会把整个帧泵永久锁死 → 画面冻结、
          //   手势追踪零数据。改为串行「发后不理」+ 超时兜底放行下一帧。
          if (hands && !sendBusy) {
            sendBusy = true;
            const h = hands;
            // ★ 关键修复：抓到的帧先画到离屏 canvas 再喂 MediaPipe。
            //   直接喂 ImageBitmap（ImageCapture.grabFrame 返回值）在多数浏览器下
            //   会静默检测不出手（画面里手清晰却报"未检测到手"）；canvas 输入在
            //   MediaPipe 上最可靠，真实手也能稳定识别。
            const fw = frame.width || frame.videoWidth || 640;
            const fh = frame.height || frame.videoHeight || 480;
            if (mpCanvas.width !== fw) mpCanvas.width = fw;
            if (mpCanvas.height !== fh) mpCanvas.height = fh;
            mpCtx.drawImage(frame, 0, 0, fw, fh);
            Promise.resolve().then(() => h.send({ image: mpCanvas }))
              .then(() => { sendBusy = false; }, () => { sendBusy = false; });
            setTimeout(() => { if (sendBusy) sendBusy = false; }, 1200);
          }
        }
      } catch (e) { /* 忽略单帧异常 */ }
      if (imgCap) setTimeout(loop, 30);     // ImageCapture 异步抓帧，自行节流
      else requestAnimationFrame(loop);
    };
    loop();
  }

  camStartBtn.addEventListener('click', async () => {
    camStartBtn.disabled = true;
    camStartBtn.textContent = '授权中…';
    const ok = await beginCamera();
    if (ok) {
      cameraReady = true;
      hideStart();
      setHint('左下角「手势追踪」可实时看到自己的动作与识别结果 · 1/2/3 比数字 · 五指张开出 I❤U · 握拳出 💗 · 再握拳炸成发光照片球 · ✋ 手掌倾斜/转手腕自由转球（手快球快） · 👌 轻捏调取放大 · 握拳退出', 6200);
      initMediaPipe();
    } else {
      camStartBtn.disabled = false;
      camStartBtn.textContent = '重试开启摄像头';
    }
  });

  demoStartBtn.addEventListener('click', (e) => {
    e.preventDefault();
    demoMode = true;
    camCanvasVisible = false; camWrap.classList.add('hidden');   // 无摄像头时收起追踪窗
    hideStart();
    setHint('键盘演示：1/2/3 数字 · 4 告白 → F 握拳进发光照片球 · H 直达 · 空格/P 调取放大照片 · ←→↑↓ 旋转 · R 重置', 6500);
  });

  // 预置照片（CONFIG.PHOTOS 为空时用占位图）；保存 Promise 供添加队列等待，
  // 避免页面刚加载就点加号时两次 buildPhotos 并发交错。
  const initialBuild = buildPhotos(CONFIG.PHOTOS);

  /* ==================================================================
   * 10. UI：全屏按钮 / 摄像头小窗 / 自定义照片
   * ================================================================== */
  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', () => {
    const el = document.getElementById('stage');
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
    }
  });

  // 添加照片入口：点击按钮打开文件选择器 → 加入照片球
  const addBtn = document.getElementById('addBtn');
  const addStartBtn = document.getElementById('addStart');
  const fileInput = document.getElementById('fileInput');
  const openPicker = () => { try { fileInput.click(); } catch (e) { setHint('当前环境无法打开相册，请改用拖拽或 Ctrl+V 粘贴图片', 3500); } };
  addBtn.addEventListener('click', openPicker);
  if (addStartBtn) addStartBtn.addEventListener('click', (e) => { e.preventDefault(); openPicker(); });
  fileInput.addEventListener('change', (e) => {
    // 必须先拷贝成普通数组再清空：value='' 会同步清空 FileList，
    // 直接把 e.target.files 传进去会丢掉第 2 张起的所有文件。
    const picked = Array.from(e.target.files || []);
    e.target.value = '';   // 允许重复选择同一文件
    if (picked.length) queueAddPhotos(picked);
  });

  addEventListener('keydown', (e) => {
    if (e.key === 'v' || e.key === 'V') {
      camCanvasVisible = !camCanvasVisible;
      camWrap.classList.toggle('hidden', !camCanvasVisible);
      return;
    }
    if (!demoMode) return;
    switch (e.key) {
      case '1': onGesture('one');       break;
      case '2': onGesture('two');       break;
      case '3': onGesture('three');     break;
      case '4': onGesture('five');      break;   // 五指张开 = 告白 I❤U
      case 'h': case 'H': triggerPhotoWall(false); break; // 直达照片球（键盘演示快捷键，自动分裂）
      case 'f': case 'F': onGesture('fist');  break; // 握拳 = I❤U后进入照片球 / 缩回 / 返回 / 重置
      case 'r': case 'R': resetAll();    break;   // 直接重置待机
      case ' ': if (state === 'PHOTO') onGesture('pinch'); e.preventDefault(); break; // 调取/缩回照片
      case 'p': case 'P': if (state === 'PHOTO') onGesture('pinch'); break;         // 👌 捏合同义键
      case 'ArrowLeft':  if (state === 'PHOTO') injectHandMotion(-0.09, 0, 0); else shapeTargetRotY -= 0.35; e.preventDefault(); break;
      case 'ArrowRight': if (state === 'PHOTO') injectHandMotion(0.09, 0, 0);  else shapeTargetRotY += 0.35; e.preventDefault(); break;
      case 'ArrowUp':    if (state === 'PHOTO') injectHandMotion(0, -0.09, 0); e.preventDefault(); break;
      case 'ArrowDown':  if (state === 'PHOTO') injectHandMotion(0, 0.09, 0);  e.preventDefault(); break;
    }
  });

  const extraPhotos = [];   // 用户通过入口/拖拽/粘贴添加的本地图片（持久保留）
  // ★ 关键修复：先把 FileList 拷成普通数组快照。fileInput 的 change 回调末尾会执行
  //   value = '' 清空 FileList；若直接遍历它，第一次 await FileReader 让出事件循环后
  //   length 就变成 0，循环直接结束 → 选了好几张却只加进去第一张。
  async function addUserPhotos(files) {
    const list = Array.from(files || []);
    const urls = await Promise.all(list.map(f => {
      // type 为空的相册文件也尝试读取（只有明确非图片才跳过），读失败再由 filter 过滤
      if (f && f.type && !f.type.startsWith('image/')) return Promise.resolve(null);
      return new Promise(res => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = () => res(null);
        fr.readAsDataURL(f);
      });
    }));
    const valid = urls.filter(Boolean);
    if (!valid.length) { setHint('未选择到图片文件', 2600); return; }
    extraPhotos.push(...valid);
    // ★ 用户添加过照片后，球面只保留其添加的照片：不再混入 PHOTO 1~12 占位预览图。
    //   （buildPhotos 内部仅在 sources 为空时才用 DEFAULT_PHOTOS 兜底，这里必非空。）
    const all = extraPhotos.slice();
    const built = await buildPhotos(all);
    if (!built) return;                    // 被更新的构建取代：不做后续入场
    // 添加后立刻进入照片球预览，让用户直接看到所有照片（无论当前处于什么状态）
    hideStart();
    hidePhotos();
    balloonGroup.visible = flowerGroup.visible = false;
    shapeKind = null;
    burstIntoPhotos();          // 重新随机炸成发光粒子球 + 球面照片
    setState('PHOTO');
    setHint(`已添加 ${valid.length} 张照片（共 ${photos.length} 张）`, 3000);
  }
  // 串行队列：先等初始构建完成，再依次处理连续点击加号 / 拖拽 / 粘贴，
  // 避免多次 buildPhotos 交错清空 photos 丢图。
  let addChain = Promise.resolve(initialBuild).catch(() => {});
  const queueAddPhotos = (files) => {
    addChain = addChain.then(() => addUserPhotos(files)).catch(() => {});
    return addChain;
  };

  addEventListener('dragover', (e) => { e.preventDefault(); });
  addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length)
      queueAddPhotos(Array.from(e.dataTransfer.files));
  });
  addEventListener('paste', (e) => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const files = [];
    for (const it of items) if (it.type.startsWith('image/')) files.push(it.getAsFile());
    if (files.length) queueAddPhotos(files);
  });
})();
</script>
</body>
</html>
